[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alval"
version = "0.1.0"
description = "Active learning for label-efficient validation of satellite land cover maps"
authors = [{ name = "Antonin Gauthé" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbclient", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
